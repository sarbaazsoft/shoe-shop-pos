<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SarbaazSoft Shoe Shop POS</title>
    <meta name="description" content="Multi-tenant dual-engine wholesale shoe shop POS and inventory management system with offline sync, barcode label printing, and multi-store support." />
    <meta property="og:title" content="SarbaazSoft Shoe POS" />
    <meta property="og:description" content="Multi-tenant dual-engine wholesale shoe shop POS and inventory management system with offline sync, barcode label printing, and multi-store support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Inter & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700;800&display=swap" />

    <!-- PWA & Mobile Meta Tags (App Primary Purple Theme) -->
    <meta name="theme-color" content="#9333EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SarbaazSoft Shoe Shop POS" />
    <meta name="application-name" content="SarbaazSoft Shoe Shop POS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/admin/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/admin/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/admin/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/admin/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/admin/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Prevent flash during bootstrap with solid white background -->
    <style>
      html, body {
        background-color: #FFFFFF;
      }
    </style>

    <!-- Initialize Theme before React renders to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('pos_theme');
          let isDark = false;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (stored === 'light') {
            isDark = false;
          } else {
            // default to light
            isDark = false;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- PWA Install Prompt Capture & Root Service Worker Registration (PWABuilder & Chromium WebAPK compliant) -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-captured'));
      });

      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
      });

      if ('serviceWorker' in navigator) {
        var registerRootServiceWorker = function () {
          var hadController = Boolean(navigator.serviceWorker.controller);
          var refreshing = false;

          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (hadController && !refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(function (registration) {
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              registration.addEventListener('updatefound', function () {
                var newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function () {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
              registration.update().catch(function () {});
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(function () {});
                }
              });
            })
            .catch(function (error) {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        };

        if (document.readyState === 'complete') {
          registerRootServiceWorker();
        } else {
          window.addEventListener('load', registerRootServiceWorker);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
